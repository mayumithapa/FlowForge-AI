services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: flowforge-backend
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: flowforge-db
          property: connectionString
      - key: REDIS_URL
        sync: false   # set manually in dashboard
      - key: RABBITMQ_URL
        sync: false   # set manually in dashboard
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 900
      - key: JWT_REFRESH_TTL
        value: 2592000
      - key: OPENAI_API_KEY
        sync: false   # set manually in dashboard (Groq key when AI_BASE_URL points to Groq)
      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile   # Groq model; switch to e.g. "gpt-4o-mini" only if using OpenAI directly
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1   # remove / unset to use OpenAI directly
      - key: AI_RATE_LIMIT_PER_MIN
        value: 60
      - key: CORS_ORIGIN
        sync: false   # set to your Vercel URL after deploying frontend

  # ── Worker (RabbitMQ consumer) ───────────────────────────────────────────────
  - type: web
    name: flowforge-worker
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.worker
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: flowforge-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false   # Groq key when AI_BASE_URL points to Groq
      - key: OPENAI_MODEL
        value: llama-3.3-70b-versatile   # Groq model
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_RATE_LIMIT_PER_MIN
        value: 60
      - key: WORKER_CONCURRENCY
        value: 5
      - key: EMAIL_PROVIDER
        value: brevo   # "resend" | "brevo" | "mock"
      - key: RESEND_API_KEY
        sync: false   # set manually in dashboard (only if EMAIL_PROVIDER=resend)
      - key: BREVO_API_KEY
        sync: false   # set manually in dashboard (only if EMAIL_PROVIDER=brevo)
      - key: EMAIL_FROM
        value: FlowForge AI <onboarding@resend.dev>

# ── PostgreSQL Database ─────────────────────────────────────────────────────────
databases:
  - name: flowforge-db
    plan: free
    databaseName: flowforge
    user: flowforge
